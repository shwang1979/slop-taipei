<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Slop 台北</title>
  <link rel="icon" href="data:," />
  <meta name="description" content="用 Three.js WebGPURenderer 與 TSL 打造的 1:1 台北市模擬：OpenStreetMap 的真實街道與四萬五千棟建築，步行、開計程車、騎機車或搭直升機，從西門町、台北車站一路到信義區與台北101。" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <!-- three.js r186 (served by jsDelivr) -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
        "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
        "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.tsl.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
      }
    }
  </script>
  <!-- Fetch the city modules in parallel before stylesheets; the module graph controls evaluation order. -->
  <link rel="modulepreload" href="./js/taipei-geodata.js" />
  <link rel="modulepreload" href="./js/city-config.js" />
  <link rel="modulepreload" href="./js/tsl-materials.js" />
  <link rel="modulepreload" href="./js/trees.js" />
  <link rel="modulepreload" href="./js/actor-models.js" />
  <link rel="modulepreload" href="./js/vehicle-lights.js" />
  <link rel="modulepreload" href="./js/pedestrians.js" />
  <link rel="modulepreload" href="./js/scooter-model.js" />
  <link rel="modulepreload" href="./js/lighting.js" />
  <link rel="modulepreload" href="./js/ground.js" />
  <link rel="modulepreload" href="./js/buildings.js" />
  <link rel="modulepreload" href="./js/road-paint.js" />
  <link rel="modulepreload" href="./js/elevated.js" />
  <link rel="modulepreload" href="./js/street-props.js" />
  <link rel="modulepreload" href="./js/landmarks.js" />
  <link rel="modulepreload" href="./js/garbage-truck.js" />
  <link rel="modulepreload" href="./js/traffic.js" />
  <link rel="modulepreload" href="./js/controllers.js" />
  <link rel="modulepreload" href="./js/touch-controls.js" />
  <link rel="modulepreload" href="./js/gamepad-controls.js" />
  <link rel="modulepreload" href="./js/cameras.js" />
  <link rel="modulepreload" href="./js/taipei-map.js" />
  <link rel="modulepreload" href="./js/scene-culling.js" />
  <link rel="modulepreload" href="./js/post-processing.js" />
  <link rel="modulepreload" href="./js/audio-synthesis.js" />
  <link rel="modulepreload" href="./js/audio-events.js" />
  <link rel="modulepreload" href="./js/audio-sources.js" />
  <link rel="modulepreload" href="./js/audio-acoustics.js" />
  <link rel="modulepreload" href="./js/audio-system.js" />
  <link rel="modulepreload" href="./js/main.js" />
  <script type="module" src="./js/main.js"></script>
  <!-- Inter & Noto Sans TC (UI), Overpass (street-name plates) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&amp;family=Noto+Sans+TC:wght@400;500;700;900&amp;family=Overpass:wght@600;700&amp;display=swap" />
  <link rel="stylesheet" href="./css/style.css?v=20261024-taipei" />
</head>
<body>
  <!-- Icon sprite (24 × 24 stroke icons, drawn in currentColor) -->
  <svg class="icon-sprite" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-walk" viewBox="0 0 24 24"><circle cx="13" cy="4.4" r="2"/><path d="M12.3 8.2 10.8 13.8M10.8 13.8 9.2 17.2 7.2 20.5M10.8 13.8l2.4 3 1.6 3.8M12.3 8.6 9.6 10.2l-.8 2.6M12.3 8.6l2.1 2.4 2.4.8"/></symbol>
      <symbol id="i-car" viewBox="0 0 24 24"><path d="M9.6 4.8V3.4a.6.6 0 0 1 .6-.6h3.6a.6.6 0 0 1 .6.6v1.4"/><path d="m5.2 10.5 1.4-4.1A2.2 2.2 0 0 1 8.7 4.8h6.6a2.2 2.2 0 0 1 2.1 1.6l1.4 4.1"/><rect x="3" y="10.5" width="18" height="6.5" rx="2"/><path d="M6 17v2.6M18 17v2.6M6.6 13.8h1.6M15.8 13.8h1.6"/></symbol>
      <symbol id="i-scooter" viewBox="0 0 24 24"><circle cx="5.8" cy="17" r="2.6"/><circle cx="18.2" cy="17" r="2.6"/><path d="M8.4 17h6.6l1.6-6.2M16.6 10.8 15.2 5.2h2.6M3.6 13.6h6.6l1.2 3.4M9.4 10.4h3.8"/></symbol>
      <symbol id="i-heli" viewBox="0 0 24 24"><path d="M3.5 4h15M11 4v3.2"/><path d="M6 12.2a5 5 0 0 1 5-5h1.6a4.4 4.4 0 0 1 4.4 4.4V15H8.8A2.8 2.8 0 0 1 6 12.2z"/><path d="M17 11h4.2M21.2 8.8v4.4M7 19h10.5M9.5 15v4M15 15v4"/></symbol>
      <symbol id="i-golden" viewBox="0 0 24 24"><path d="M3 17.5h18M7 17.5a5 5 0 0 1 10 0M12 5v3M5.6 9.6l2 1.6M18.4 9.6l-2 1.6M7.5 21h9"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.8v2.1M12 19.1v2.1M2.8 12h2.1M19.1 12h2.1M5.5 5.5 7 7M17 17l1.5 1.5M5.5 18.5 7 17M17 7l1.5-1.5"/></symbol>
      <symbol id="i-twilight" viewBox="0 0 24 24"><path d="M3 15.5h18M7.5 19h9M8 15.5a4 4 0 0 1 8 0M17.5 4v3.2M15.9 5.6h3.2M7 7.4v1.8M6.1 8.3h1.8"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M19.5 14.6A7.8 7.8 0 0 1 9.4 4.5a7.8 7.8 0 1 0 10.1 10.1z"/></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21.2s-6.6-5.7-6.6-11.2a6.6 6.6 0 0 1 13.2 0c0 5.5-6.6 11.2-6.6 11.2z"/><circle cx="12" cy="10" r="2.4"/></symbol>
      <symbol id="i-map" viewBox="0 0 24 24"><path d="M9 4.5 3.5 6.6v13l5.5-2.1 6 2.1 5.5-2.1v-13L15 6.6 9 4.5zM9 4.5v13M15 6.6v13"/></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12s3.5-6.5 9.5-6.5 9.5 6.5 9.5 6.5-3.5 6.5-9.5 6.5S2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></symbol>
      <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M3.5 3.5l17 17M10.6 5.6c.5-.1.9-.1 1.4-.1 6 0 9.5 6.5 9.5 6.5a16 16 0 0 1-2.4 3.2M6.6 6.6A15.6 15.6 0 0 0 2.5 12s3.5 6.5 9.5 6.5c1.6 0 3.1-.4 4.4-1.1M9.9 9.9a2.8 2.8 0 0 0 4.2 4.2"/></symbol>
      <symbol id="i-sound" viewBox="0 0 24 24"><path d="m11 4-5 4H3v8h3l5 4V4ZM15 8a6 6 0 0 1 0 8M18 5a10 10 0 0 1 0 14"/></symbol>
      <symbol id="i-sound-off" viewBox="0 0 24 24"><path d="m11 4-5 4H3v8h3l5 4V4ZM16 9l6 6M22 9l-6 6"/></symbol>
      <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m7 9.5 5 5 5-5"/></symbol>
      <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="M14.5 6.5 9 12l5.5 5.5"/></symbol>
      <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9.5 6.5 5.5 5.5-5.5 5.5"/></symbol>
      <symbol id="i-camera" viewBox="0 0 24 24"><rect x="2.8" y="6.5" width="12.4" height="11" rx="2.4"/><path d="m15.2 10.4 6-3.4v10l-6-3.4"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5.5v13M5.5 12h13"/></symbol>
      <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5.5 12h13"/></symbol>
      <symbol id="i-locate" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6.4"/><circle cx="12" cy="12" r="1.7" fill="currentColor"/><path d="M12 2.5v3.1M12 18.4v3.1M2.5 12h3.1M18.4 12h3.1"/></symbol>
      <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.3"/><path d="m20 20-4.6-4.6"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m6.5 6.5 11 11M17.5 6.5l-11 11"/></symbol>
    </defs>
  </svg>

  <!-- Loading Screen -->
  <div id="loading-overlay" role="status" aria-live="polite">
    <div class="loader">
      <span class="mta-bullet loader-bullet" aria-hidden="true">北</span>
      <div class="loader-title">Slop 台北</div>
      <div class="loader-track is-indeterminate" aria-hidden="true"><span id="loading-progress" class="loader-fill"></span></div>
      <div id="loading-status">正在初始化 WebGPURenderer 與 TSL 著色器…</div>
    </div>
  </div>

  <!-- 3D WebGPU Viewport Container -->
  <main id="canvas-container" aria-label="Slop 台北 3D 互動畫面"></main>

  <!-- Top-Left: Brand & Renderer Telemetry -->
  <header class="hud hud-top-left">
    <div class="panel brand">
      <span class="mta-bullet" aria-hidden="true">北</span>
      <div class="brand-titles">
        <div class="brand-heading">
          <h1>Slop 台北</h1>
          <a class="repo-link" href="https://github.com/mrdoob/slop-newyork/" target="_blank" rel="noopener noreferrer" aria-label="改編自 mrdoob 的 Slop New York（在新分頁開啟）">源自 Slop NY <span aria-hidden="true">↗</span></a>
        </div>
        <div class="brand-subtitle">three.js · WebGPU · TSL · <span id="hud-fps" class="fps-ok">60</span> fps</div>
      </div>
    </div>
  </header>

  <!-- Top-Right Toolbar: Time of Day, Teleport, Map & Clean View -->
  <div class="hud hud-top-right">
    <div id="hud-toolbar" class="panel toolbar">
      <div class="time-switch" role="group" aria-label="天色與時間">
        <button id="time-golden" class="time-btn active" data-time="golden" type="button" title="黃金時刻 17:30">
          <svg class="icon" aria-hidden="true"><use href="#i-golden"/></svg><span class="seg-label">黃昏</span>
        </button>
        <button id="time-midday" class="time-btn" data-time="midday" type="button" title="晴朗正午 12:30">
          <svg class="icon" aria-hidden="true"><use href="#i-sun"/></svg><span class="seg-label">正午</span>
        </button>
        <button id="time-twilight" class="time-btn" data-time="twilight" type="button" title="藍調時刻 18:40">
          <svg class="icon" aria-hidden="true"><use href="#i-twilight"/></svg><span class="seg-label">藍調</span>
        </button>
        <button id="time-midnight" class="time-btn" data-time="midnight" type="button" title="夜晚 23:00">
          <svg class="icon" aria-hidden="true"><use href="#i-moon"/></svg><span class="seg-label">夜晚</span>
        </button>
      </div>
      <span class="toolbar-divider" aria-hidden="true"></span>
      <button id="btn-teleport" class="tool-btn" type="button" popovertarget="teleport-popover" title="把目前的角色傳送到…">
        <svg class="icon" aria-hidden="true"><use href="#i-pin"/></svg><span class="tool-label">傳送</span><svg class="icon icon-sm" aria-hidden="true"><use href="#i-chevron-down"/></svg>
      </button>
      <button id="btn-open-map" class="tool-btn" type="button" title="台北市街道地圖 [M]">
        <svg class="icon" aria-hidden="true"><use href="#i-map"/></svg><span class="tool-label">地圖</span><kbd>M</kbd>
      </button>
      <span class="toolbar-divider" aria-hidden="true"></span>
      <button id="btn-sound" class="tool-btn icon-only" type="button" title="靜音 [N]" aria-label="靜音" aria-pressed="true">
        <svg class="icon" aria-hidden="true"><use href="#i-sound"/></svg>
      </button>
      <button id="btn-toggle-hud" class="tool-btn icon-only" type="button" title="純淨畫面：隱藏介面 [H]" aria-label="隱藏介面" aria-pressed="false">
        <svg class="icon icon-hide" aria-hidden="true"><use href="#i-eye"/></svg><svg class="icon icon-show" aria-hidden="true"><use href="#i-eye-off"/></svg>
      </button>
    </div>
  </div>

  <!-- Teleport Destinations (native popover: light-dismiss & Esc; filled from TELEPORT_LOCATIONS by main.js) -->
  <div id="teleport-popover" class="popover" popover data-side="below" data-anchor="hud-toolbar" aria-label="傳送目前的角色">
    <div class="pop-title">傳送到</div>
  </div>

  <!-- Bottom-Left: Street-Name Signs & Live GPS Radar Minimap -->
  <div class="hud hud-bottom-left">
    <div id="hud-location" class="location" aria-live="off"></div>
    <aside id="minimap-card" class="panel radar" aria-label="即時街道小地圖" title="開啟台北市街道地圖 [M]">
      <canvas id="minimap-canvas"></canvas>
      <span class="radar-north" aria-hidden="true">N</span>
      <kbd class="radar-key">M</kbd>
    </aside>
  </div>

  <!-- Bottom-Center: Third-Person Mode Switcher & Controls Guide -->
  <footer class="hud hud-bottom-center">
    <div id="hud-controls-hint" class="controls-hint"></div>
    <nav id="mode-switch" class="panel mode-switch" aria-label="移動方式">
      <span class="mode-indicator" aria-hidden="true"></span>
      <button id="mode-person" class="mode-btn" data-mode="person" type="button" title="步行 [1]">
        <svg class="icon" aria-hidden="true"><use href="#i-walk"/></svg><span class="mode-label">步行</span><kbd>1</kbd>
      </button>
      <button id="mode-car" class="mode-btn active" data-mode="car" type="button" title="開計程車 [2]">
        <svg class="icon" aria-hidden="true"><use href="#i-car"/></svg><span class="mode-label">開車</span><kbd>2</kbd>
      </button>
      <button id="mode-scooter" class="mode-btn" data-mode="scooter" type="button" title="騎機車 [3]">
        <svg class="icon" aria-hidden="true"><use href="#i-scooter"/></svg><span class="mode-label">機車</span><kbd>3</kbd>
      </button>
      <button id="mode-helicopter" class="mode-btn" data-mode="helicopter" type="button" title="直升機 [4]">
        <svg class="icon" aria-hidden="true"><use href="#i-heli"/></svg><span class="mode-label">飛行</span><kbd>4</kbd>
      </button>
    </nav>
  </footer>

  <!-- Bottom-Right: Speed Cluster & Camera Switcher -->
  <div class="hud hud-bottom-right">
    <section id="hud-cluster" class="panel cluster" aria-label="速度與攝影機">
      <div class="gauge">
        <div class="gauge-top">
          <span id="hud-active-mode" class="gauge-label">臺北小黃 計程車</span>
          <span class="gauge-alt"><span class="gauge-alt-label">高度</span> <span id="hud-altitude">0</span> m</span>
        </div>
        <div class="gauge-speed"><span id="hud-speed">0</span><span class="gauge-unit">km/h</span></div>
        <div class="gauge-meter" aria-hidden="true"><span id="hud-speed-meter"></span></div>
      </div>
      <div id="camera-switch" class="camera-switch">
        <button id="cam-prev" class="icon-btn" type="button" title="上一個攝影機" aria-label="上一個攝影機">
          <svg class="icon" aria-hidden="true"><use href="#i-chevron-left"/></svg>
        </button>
        <button id="cam-menu-btn" class="camera-current" type="button" popovertarget="camera-popover" title="所有攝影機 [V 切換]">
          <svg class="icon" aria-hidden="true"><use href="#i-camera"/></svg><span id="hud-active-camera">第三人稱追蹤</span><kbd>V</kbd>
        </button>
        <button id="cam-next" class="icon-btn" type="button" title="下一個攝影機 [V]" aria-label="下一個攝影機">
          <svg class="icon" aria-hidden="true"><use href="#i-chevron-right"/></svg>
        </button>
      </div>
    </section>
  </div>

  <!-- Touch input stays available in clean view; the map temporarily suspends it. -->
  <section id="touch-controls" aria-label="觸控操作" hidden>
    <div class="touch-movement">
      <div id="touch-stick" role="group" aria-label="移動搖桿：上下移動，左右轉向">
        <span class="touch-stick-axis" aria-hidden="true"></span>
        <span id="touch-stick-knob" aria-hidden="true"></span>
      </div>
      <span class="touch-caption">移動與轉向</span>
    </div>
    <p class="touch-look-hint">拖曳環顧 · 雙指縮放</p>
    <div class="touch-actions" role="group" aria-label="按住執行動作">
      <button class="touch-action" data-touch-action="up" type="button" aria-label="跳躍" aria-pressed="false" hidden>
        <span aria-hidden="true">↑</span><span data-touch-label="up">跳躍</span>
      </button>
      <button class="touch-action" data-touch-action="down" type="button" aria-label="下降" aria-pressed="false" hidden>
        <span aria-hidden="true">↓</span><span data-touch-label="down">下降</span>
      </button>
      <button class="touch-action touch-boost" data-touch-action="boost" type="button" aria-label="加速" aria-pressed="false">
        <span aria-hidden="true">↟</span><span data-touch-label="boost">加速</span>
      </button>
    </div>
  </section>

  <!-- All Cameras: 3 follow cameras, the Taipei vantage points & the auto-director drone (filled by main.js) -->
  <div id="camera-popover" class="popover" popover data-side="above" data-anchor="hud-cluster" data-align="hud-cluster" aria-label="攝影機">
  </div>

  <!-- Full-Screen Interactive Taipei Street Map ([M]) -->
  <section id="fullmap-modal" class="fullmap-modal hidden" role="dialog" aria-modal="true" aria-label="台北市互動街道地圖">
    <div id="fullmap-canvas-wrap" class="fullmap-canvas-wrap">
      <canvas id="fullmap-canvas"></canvas>
    </div>

    <div class="fullmap-header">
      <div class="panel fullmap-title">
        <span class="mta-bullet" aria-hidden="true">北</span>
        <div>
          <h2>臺北市街道圖</h2>
          <p id="fullmap-player-info" class="fullmap-subtitle">你在 信義路五段</p>
        </div>
      </div>
      <label class="panel fullmap-search-wrap">
        <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
        <input id="fullmap-search" class="fullmap-search" type="text" placeholder="搜尋路名與地標：忠孝東路、西門町、台北101…" aria-label="搜尋路名或地標" autocomplete="off" spellcheck="false" />
      </label>
      <button id="close-fullmap-btn" class="panel tool-btn fullmap-close" type="button" title="關閉地圖 [M / Esc]">
        <svg class="icon" aria-hidden="true"><use href="#i-close"/></svg><span class="tool-label">關閉</span><kbd>Esc</kbd>
      </button>
    </div>

    <div class="map-controls">
      <div class="panel map-compass" title="正北方">
        <svg viewBox="0 0 44 44" aria-hidden="true">
          <g id="map-compass-needle">
            <path d="M22 9.5 25.6 22h-7.2z" fill="#f05a4f"/>
            <path d="M22 34.5 25.6 22h-7.2z" fill="rgba(255,255,255,0.72)"/>
            <text x="22" y="8" text-anchor="middle">N</text>
          </g>
        </svg>
      </div>
      <div class="panel map-zoom">
        <button id="map-zoom-in" class="icon-btn" type="button" title="放大" aria-label="放大"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg></button>
        <button id="map-zoom-out" class="icon-btn" type="button" title="縮小" aria-label="縮小"><svg class="icon" aria-hidden="true"><use href="#i-minus"/></svg></button>
      </div>
      <div class="panel map-zoom">
        <button id="map-center-player" class="icon-btn" type="button" title="回到你的位置" aria-label="回到你的位置"><svg class="icon" aria-hidden="true"><use href="#i-locate"/></svg></button>
        <button id="map-view-all" class="icon-btn" type="button" title="顯示整個市中心（萬華到信義、公館到圓山）" aria-label="顯示全部"><svg class="icon" aria-hidden="true"><use href="#i-fit"/></svg></button>
      </div>
    </div>

    <div class="fullmap-footer">
      <div class="panel fullmap-status">
        <span id="fullmap-hover-info">點一下傳送過去 · 拖曳平移 · 滾輪縮放</span>
      </div>
    </div>

    <div class="panel fullmap-legend">
      <span class="legend-item"><span class="legend-swatch player-swatch"></span>你</span>
      <span class="legend-item"><span class="legend-swatch landmark-swatch"></span>地標</span>
      <span class="legend-item"><span class="legend-swatch gps-swatch"></span>捷運站</span>
      <span class="legend-item"><span class="legend-swatch bridge-swatch"></span>高架 / 快速道路</span>
      <span id="fullmap-counts" class="legend-counts"></span>
    </div>
  </section>

</body>
</html>
